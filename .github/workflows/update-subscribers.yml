
name: Actualizar suscriptores de Alcazar Music

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Consultar YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          params = urllib.parse.urlencode({
              "part": "statistics",
              "forHandle": "@alcazarmusic",
              "key": os.environ["YOUTUBE_API_KEY"]
          })

          url = "https://www.googleapis.com/youtube/v3/channels?" + params

          with urllib.request.urlopen(url) as response:
              data = json.loads(response.read())

          if not data.get("items"):
              raise Exception("No se encontró el canal de YouTube")

          subscribers = data["items"][0]["statistics"]["subscriberCount"]

          result = {
              "subscribers": int(subscribers),
              "updatedAt": datetime.now(timezone.utc).isoformat()
          }

          with open("subscriber-count.json", "w") as file:
              json.dump(result, file, indent=2)

          print("Suscriptores actualizados:", subscribers)
          PY

      - name: Guardar actualización
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscriber-count.json
          git diff --cached --quiet || (git commit -m "Actualizar contador de suscriptores" && git push)
